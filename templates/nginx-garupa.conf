# /etc/nginx/conf.d/garupa.conf, gerado pelo 02_app.sh.
# Recebe na porta 80 e repassa para a API em 127.0.0.1:${APP_PORTA}.

# Log sem dados pessoais: grava só o caminho (a query string teria lat/lon),
# mascara tokens e IDs e zera o último bloco do IP.
map $uri $garupa_caminho_log {
    ~^/api/v1/acompanhar/  "/api/v1/acompanhar/***";
    ~^/api/v1/vestivel/    "/api/v1/vestivel/***";
    ~^/api/v1/usuarios/    "/api/v1/usuarios/***";
    default                $uri;
}

map $remote_addr $garupa_ip_anonimo {
    ~^(?<prefixo>\d+\.\d+\.\d+)\.\d+$  "${prefixo}.0";
    default                             "ipv6-ou-outro";
}

log_format garupa_sem_pii '$time_iso8601 ip=$garupa_ip_anonimo metodo=$request_method '
                          'caminho=$garupa_caminho_log status=$status bytes=$body_bytes_sent '
                          'tempo=$request_time upstream=$upstream_response_time';

upstream garupa_api {
    server 127.0.0.1:${APP_PORTA};
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name ${VM_HOSTNAME};

    access_log /var/log/nginx/garupa-acesso.log garupa_sem_pii;
    error_log  /var/log/nginx/garupa-erro.log warn;

    client_max_body_size 1m;   # a API só recebe JSON curto
    server_tokens off;         # não expõe a versão do Nginx

    location / {
        proxy_pass         http://garupa_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
